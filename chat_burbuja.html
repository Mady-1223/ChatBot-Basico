<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot FORJA</title>
    <style>
    /* === ESTILOS GENERALES === */
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background-color: #E1C699;
    }

    /* === BURBUJA FLOTANTE === */
    .chat-bubble {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: #501314;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      transition: background 0.3s;
      z-index: 1000;
    }

    .chat-bubble:hover {
      background: #501314; /* Contraste mayor al pasar el mouse */
    }

    /* === CONTENEDOR DEL CHATBOT (oculto inicialmente) === */
    .chat-container {
      position: fixed;
      bottom: 90px;
      right: 20px;
      width: 100%;
      max-width: 380px;
      height: 500px;
      background: #FFFFFF;
      border-radius: 12px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.2);
      display: flex;
      flex-direction: column;
      opacity: 0;
      pointer-events: none;
      transform: translateY(20px);
      transition: opacity 0.3s ease, transform 0.3s ease;
      overflow: hidden;
    }

    /* Cuando está activo se muestra con animación */
    .chat-container.active {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    /* === CABECERA DEL CHATBOT === */
    .chat-header {
      background: #501314;
      color: #FFFFFF;
      padding: 12px;
      text-align: center;
      font-size: 16px;
      font-weight: bold;
      position: relative;
    }

    /* Botón para cerrar el chat */
    .close-btn {
      position: absolute;
      right: 12px;
      top: 12px;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 18px;
      cursor: pointer;
    }

    /* === ÁREA DE MENSAJES === */
    .messages {
      flex: 1;
      padding: 12px;
      overflow-y: auto;
      background: #FFFFFF;
    }

    .message {
      margin: 8px 0;
      padding: 10px;
      border-radius: 10px;
      max-width: 75%;
      font-size: 14px;
      line-height: 1.4;
    }

    .user {
      background-color: #E1C699;
      align-self: flex-end;
      margin-left: auto;
    }

    .bot {
      background-color: #501314;
      align-self: flex-start;
      margin-right: auto;
      color: #FFFFFF
    }

    /* === ÁREA DE INPUT === */
    .input-area {
      display: flex;
      border-top: 1px solid gray;
      background: beige;
    }

    .input-area input {
      flex: 1;
      padding: 12px;
      border: none;
      outline: none;
      font-size: 14px;
    }

    .input-area button {
      padding: 12px 16px;
      background: #501314;
      color: white;
      border: none;
      cursor: pointer;
      transition: background 0.3s;
    }

    .input-area button:hover {
      background: #501314;
    }

    /* === ACCESIBILIDAD Y RESPONSIVIDAD === */
    @media (max-width: 480px) {
      .chat-container {
        right: 10px;
        left: 10px;
        height: 70vh; /* altura dinámica para móviles */
      }
    }
  </style>
</head>
<body>
<!-- BURBUJA FLOTANTE -->
  <button class="chat-bubble" id="chatToggle" aria-label="Abrir chat con el bot">🥋</button>

  <!-- CONTENEDOR PRINCIPAL DEL CHAT -->
  <div class="chat-container" id="chatContainer" role="dialog" aria-modal="true" aria-labelledby="chatTitle">
    <!-- CABECERA -->
    <div class="chat-header">
      <span id="chatTitle">Forja BJJ — Asistente</span>
      <button class="close-btn" id="closeChat" aria-label="Cerrar chat">✖</button>
    </div>

    <!-- ÁREA DE MENSAJES -->
    <div class="messages" id="messages" role="log" aria-live="polite"></div>

    <!-- ÁREA DE INPUT -->
    <div class="input-area">
      <input type="text" id="userInput" aria-label="Escribe tu mensaje" placeholder="Escribe tu pregunta o número..." />
      <button id="sendBtn">Enviar</button>
    </div>
  </div>

  <script>
    // === REFERENCIAS A ELEMENTOS DEL DOM ===
    const chatToggle = document.getElementById("chatToggle");
    const chatContainer = document.getElementById("chatContainer");
    const closeChat = document.getElementById("closeChat");
    const messages = document.getElementById("messages");
    const userInput = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");

    /* === FUNCIÓN: agregar mensaje al área === */
    function addMessage(text, sender) {
      const div = document.createElement("div");
      div.classList.add("message", sender);
      // Reemplazamos \n por <br> usando innerHTML para que respete los saltos de línea
      div.innerHTML = text.replace(/\n/g, '<br>');
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight; // siempre baja al último mensaje
    }

    /* === RESPUESTAS DEL BOT (FORJA BJJ) === */
    function botResponse(input) {
      const pregunta = input.toLowerCase();

      if (pregunta.includes("hola") || pregunta.includes("menu") || pregunta.includes("menú")) {
        return "¡Hola! 🥋 Bienvenido/a a la Academia Forja BJJ. Soy tu asistente virtual.\n\n" +
               "¿En qué te puedo ayudar hoy? Selecciona o escribe el número de la opción que prefieras:\n\n" +
               "1. ¿Qué necesito para mi primera clase?\n" +
               "2. ¿Ofrecen clase de prueba gratis?\n" +
               "3. Ver horarios de entrenamiento\n" +
               "4. Precios y planes de mensualidad\n" +
               "5. ¿Tienen clases con Gi y No-Gi?\n" +
               "6. ¿Puedo empezar si no tengo experiencia previa?\n" +
               "7. Ubicación y contacto\n" +
               "8. Hablar con un asesor / Entrenador";
      } 
      else if (pregunta.includes("1")) {
        return "¡No necesitas experiencia previa! Para tu clase de prueba solo necesitas traer:\n\n" +
               "• Ropa deportiva cómoda (pantaloneta/leggings y camiseta pegada al cuerpo).\n" +
               "• Una botella de agua.\n" +
               "• Ganas de aprender.\n\n" +
               "Nota: Si ya tienes Gi (kimono), puedes traerlo. Si no, ¡no te preocupes! Aquí te guiamos.";
      } 
      else if (pregunta.includes("2")) {
        return "¡Sí! Ofrecemos 1 clase de prueba totalmente gratis para que conozcas las instalaciones, los profesores y la dinámica del entrenamiento. ¿Te gustaría agendar la tuya?";
      } 
      else if (pregunta.includes("3")) {
        return "Contamos con horarios flexibles en la mañana y en la noche:\n\n" +
               "• Lunes a Viernes:\n"+
               "Mañanas: 11:00 AM – 12:00 AM\n"+
               "Noches: 7:00 PM – 8:30 PM (Clases con y sin Gi)\n"+
               "Domingos:\n"+
               "Open Mat / Entrenamiento libre: 10:00 AM – 12:00 PM\n";

      } 
      else if (pregunta.includes("4")) {
        return "Manejamos diferentes opciones adaptadas a tu disponibilidad:\n\n" +
               "• Pase mensual ilimitado\n" +
               "• Plan 3 días a la semana\n" +
               "• Clase individual / Tiquetera\n\n" +
               "Consulta por nuestros descuentos para estudiantes y grupos familiares.";
      } 
      else if (pregunta.includes("5")) {
        return "¡Enseñamos ambos estilos! Contamos con días específicos para entrenamiento con Gi (kimono tradicional) y sesiones de No-Gi (grappling con rashguard).";
      } 
      else if (pregunta.includes("6")) {
        return "¡Absolutamente! La mayoría de nuestros estudiantes empiezan desde cero. Nuestras clases fundamentales están diseñadas para enseñarte desde cómo caer de forma segura, posiciones y técnicas básicas paso a paso.";
      } 
      else if (pregunta.includes("7")) {
        return "Nos encontramos ubicados en nuestra sede principal de Forja BJJ. ¡Escríbenos para enviarte la ubicación exacta por GPS!";
      } 
      else if (pregunta.includes("8")) {
        return "Un momento por favor, te pondremos en contacto directo con uno de nuestros entrenadores. 🥋";
      } 
      else if (pregunta.includes("salir")) {
        return "Gracias por consultar con Forja BJJ. ¡Esperamos verte pronto en el tatami! 👋";
      } 
      else {
        return "Lo siento, no entendí tu consulta. Escribe 'Hola' o 'Menú' para ver la lista de opciones disponibles.";
      }
    }

    /* === FUNCIÓN: enviar mensaje del usuario === */
    function sendMessage() {
      const text = userInput.value.trim();
      if (!text) return;

      addMessage(text, "user"); // añade mensaje de usuario
      userInput.value = ""; // limpia input

      // pequeña pausa para simular procesamiento
      const respuesta = botResponse(text);
      setTimeout(() => addMessage(respuesta, "bot"), 400);
    }

    /* === EVENTOS === */

    // Abrir chatbot al hacer clic en la burbuja
    chatToggle.addEventListener("click", () => {
      chatContainer.classList.add("active");
      userInput.focus();
      // Si el chat está vacío al abrirlo, muestra el mensaje inicial
      if (messages.children.length === 0) {
        init();
      }
    });

    // Cerrar chatbot y limpiar historial de mensajes
    closeChat.addEventListener("click", () => {
      chatContainer.classList.remove("active");
      messages.innerHTML = ""; // limpia mensajes automáticamente
    });

    // Botón enviar
    sendBtn.addEventListener("click", sendMessage);

    // Enviar con tecla Enter
    userInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") sendMessage();
    });

    /*************************************************************************
     * Inicialización: añadir mensaje de bienvenida
     *************************************************************************/
    function init() {
      addMessage(botResponse("hola"), 'bot');
    }
  </script>
</body>
</html>
