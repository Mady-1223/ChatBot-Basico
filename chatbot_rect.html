<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chatbot FORJA</title>

    <style>
      /* ==== ESTILOS GENERALES ==== */
      body {
        font-family: Arial, sans-serif; /* Fuente clara y legible */
        background-color: #E1C699; /* Fondo gris suave */
        display: flex; /* Usamos flexbox para centrar */
        justify-content: center;
        align-items: center;
        height: 100vh; /* Ocupa toda la pantalla */
        margin: 0;
      }

      /* ==== CONTENEDOR DEL CHAT ==== */
      .chat-container {
        width: 100%;
        max-width: 400px; /* Ancho máximo para que sea responsivo */
        background: #FFFFFF; /* Fondo blanco */
        border-radius: 12px; /* Bordes redondeados */
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); /* Sombra ligera */
        display: flex;
        flex-direction: column; /* Apila los elementos en columna */
        overflow: hidden;
      }

      /* ==== ÁREA DE MENSAJES ==== */
      .messages {
        flex: 1; /* Ocupa el espacio disponible */
        padding: 15px;
        overflow-y: auto; /* Scroll si hay muchos mensajes */
      }

      /* ==== MENSAJES GENERALES ==== */
      .message {
        margin: 8px 0;
        padding: 10px;
        border-radius: 10px;
        max-width: 80%; /* No ocupan todo el ancho */
      }

      /* Estilo de los mensajes del usuario */
      .user {
        background-color: #E1C699; /* Azul claro */
        align-self: flex-end; /* Se alinean a la derecha */
      }

      /* Estilo de los mensajes del bot */
      .bot {
        background-color: #501314; /* Gris claro */
        align-self: flex-start; /* Se alinean a la izquierda */
        color: #FFFFFF
      }

      /* ==== ÁREA DE ENTRADA ==== */
      .input-area {
        display: flex;
        border-top: 1px solid #ccc; /* Línea separadora superior */
      }

      /* Caja de texto */
      .input-area input {
        flex: 1; /* Ocupa todo el espacio disponible */
        padding: 12px;
        border: none;
        outline: none;
        font-size: 14px;
      }

      /* Botón de enviar */
      .input-area button {
        padding: 12px;
        background: #501314; /* Azul primario */
        color: white;
        border: none;
        cursor: pointer;
      }

      /* Efecto hover (cuando pasamos el mouse) */
      .input-area button:hover {
        background: #501314; /* Azul más oscuro */
      }


      /* Estilo para que el título "FORJA" luzca igual al de la academia */
      .titulo {
        font-family: 'Cinzel', serif;
        font-weight: 900;
        font-size: 3.5rem;
        letter-spacing: 2px;
        text-transform: uppercase;
        margin-right: 20px;
      }
    </style>
  </head>
  <body>
    <!-- Contenedor general para alinear el título y el chat lado a lado -->
    <div style="display: flex; align-items: center; gap: 30px;">
    
    <!-- Título del chat -->
    <h1 class="titulo">FORJA</h1>

    <!-- Contenedor principal del chatbot -->
    <div
      class="chat-container"
      role="region"
      aria-label="Chat con el bot educativo"
    >
      <!-- Área donde se mostrarán los mensajes -->
      <div class="messages" id="messages"></div>

      <!-- Área de entrada de texto y botón -->
      <div class="input-area">
        <input
          type="text"
          id="userInput"
          aria-label="Escribe tu pregunta"
          placeholder="Escribe tu pregunta..."
        />
        <button onclick="sendMessage()">Enviar</button>
      </div>
    </div>

    <script>
      // Referencia al contenedor donde aparecerán los mensajes
      const messages = document.getElementById("messages");

      /**
       * Función que agrega un mensaje al área de chat
       * @param {string} text - El texto del mensaje
       * @param {string} sender - El remitente ("user" o "bot")
       */
      function addMessage(text, sender) {
        const div = document.createElement("div"); // Crea un nuevo div
        div.classList.add("message", sender); // Aplica las clases de estilo
        div.innerHTML = text.replace(/\n/g, '<br>');// Agrega el texto
        messages.appendChild(div); // Lo agrega al chat
        messages.scrollTop = messages.scrollHeight; // Hace scroll automático hacia abajo
      }

      /**
       * Función que genera la respuesta del bot según la pregunta del usuario
       * @param {string} input - Texto ingresado por el usuario
       * @returns {string} respuesta del bot
       */
      function botResponse(input) {
        const pregunta = input.toLowerCase(); // Convierte a minúsculas para comparar
        if (pregunta.includes("hola")) {
          return "¡Hola! 🥋 Bienvenido/a a [Nombre de la Academia]. Soy tu asistente virtual.\n\n¿En qué te puedo ayudar hoy? Selecciona o escribe el número de la opción que prefieras:\n\n1. ¿Qué necesito para mi primera clase?\n 2. ¿Ofrecen clase de prueba gratis?\n 3. Ver horarios de entrenamiento.\n 4. Precios y planes de mensualidad.\n 5. ¿Tienen clases con Gi y No-Gi?\n 6. ¿Puedo empezar si no tengo experiencia previa?\n 7. Ubicación y contacto.\n  8. Hablar con un asesor / Entrenador";
        }
        else if (pregunta.includes("1")) {
          return"¡No necesitas experiencia previa! Para tu clase de prueba solo necesitas traer:\n\n• Ropa deportiva cómoda (pantaloneta/leggings y camiseta pegada al cuerpo).\n• Una botella de agua.\n• Ganas de aprender.\n\nNota: Si ya tienes Gi (kimono), puedes traerlo. Si no, ¡no te preocupes! Aquí te guiamos.";

        } else if (pregunta.includes("2")) {
          return "¡Sí! Ofrecemos 1 clase de prueba totalmente gratis para que conozcas las instalaciones, los profesores y la dinámica del entrenamiento. ¿Te gustaría agendar la tuya?";

        } else if (pregunta.includes("3")) {
          return "Contamos con horarios flexibles en la mañana y en la noche:\n• Lunes a Viernes:\nMañanas: 11:00 AM – 12:00 AM \nNoches: 7:00 PM – 8:30 PM (Clases con y sin Gi)\nDomingos:Open Mat / Entrenamiento libre: 10:00 AM – 12:00 PM";

        } else if (pregunta.includes("4")) {
          return  "Manejamos diferentes opciones adaptadas a tu disponibilidad:\n• Pase mensual ilimitado\n• Plan 3 días a la semana\n • Clase individual / Tiquetera  Consulta por nuestros descuentos para estudiantes y grupos familiares.";

        } else if (pregunta.includes("5")) {
          return "¡Enseñamos ambos estilos! Contamos con días específicos para entrenamiento con Gi (kimono tradicional) y sesiones de No-Gi (grappling con rashguard).";

        } else if (pregunta.includes("6")) {
          return "¡Absolutamente! La mayoría de nuestros estudiantes empiezan desde cero. Nuestras clases fundamentales están diseñadas para enseñarte desde cómo caer de forma segura, posiciones y técnicas básicas paso a paso.";

        }else if (pregunta.includes("7")) {
          return "Nos encontramos ubicados en nuestra sede principal de Forja BJJ. ¡Escríbenos para enviarte la ubicación exacta por GPS!";
          
        }else if (pregunta.includes("8")) {
          return "Un momento por favor, te pondremos en contacto directo con uno de nuestros entrenadores. 🥋";

          
        }else {
          return "Lo siento, aún no tengo respuesta para esa pregunta.";
        }
      }

      /**
       * Función que envía el mensaje del usuario y muestra la respuesta del bot
       */
      function sendMessage() {
        const input = document.getElementById("userInput");
        const text = input.value.trim(); // Elimina espacios en blanco
        if (!text) return; // No hace nada si el input está vacío

        addMessage(text, "user"); // Agrega el mensaje del usuario
        input.value = ""; // Limpia la caja de texto

        const respuesta = botResponse(text); // Obtiene la respuesta del bot
        setTimeout(() => addMessage(respuesta, "bot"), 500); // Pausa simulando "pensar"
      }

      // Permite enviar el mensaje al presionar la tecla Enter
      document.getElementById("userInput").addEventListener("keypress", (e) => {
        if (e.key === "Enter") sendMessage();
      });
    </script>
  </body>
</html>
